<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타워 디펜스 게임</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .game-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        canvas {
            border: 3px solid #4a5568;
            border-radius: 10px;
            background: #f7fafc;
            max-width: 100%;
            height: auto; /* 모바일에서 비율 유지 */
            touch-action: none; /* 터치 조작 시 화면 스크롤 방지 */
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        button {
            background: #4299e1;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        
        .game-info {
            display: none; /* 홈 화면에서는 숨김 */
        }
        
        .controls {
            display: none; /* 홈 화면에서는 숨김 */
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏰 타워 디펜스 게임 🏰</h1>
        <div style="text-align:center; margin-bottom:10px;">
            <span style="font-size:0.8rem; color:#718096;">이 게임이 마음에 드세요?</span>
            <div id="like-container-towerdefence" style="display:inline-block; margin-left:8px;"></div>
        </div>
        
        <div class="game-info" id="gameInfo">
            <div>💰 골드: <span id="gold">100</span></div>
            <div>❤️ 생명력: <span id="lives">10</span></div>
            <div>🎯 점수: <span id="score">0</span></div>
            <div>🌊 웨이브: <span id="wave">1</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="controls" id="gameControls">
            <button id="startBtn">게임 시작</button>
            <button id="pauseBtn">일시정지</button>
            <button id="restartBtn">다시 시작</button>
            <button id="speedBtn">⏩ 속도 x1</button>
            <button id="muteBtn">🔊 소리 켬</button>
        </div>
    </div>
    
    <script src="../../likes-widget.js"></script>
    <script src="game.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof LikesWidget !== 'undefined') LikesWidget.init('towerdefence');
        });
        // 화면 전환 시 UI 표시/숨김 처리
        function showGameUI() {
            document.getElementById('gameInfo').style.display = 'flex';
            document.getElementById('gameControls').style.display = 'block';
        }
        
        function hideGameUI() {
            document.getElementById('gameInfo').style.display = 'none';
            document.getElementById('gameControls').style.display = 'none';
        }
        
        // 게임 상태 변경 시 UI 업데이트
        // (기존 버그 수정: 원래 updateUI를 호출하지 않아 골드/생명력 표시가 갱신되지 않았고,
        //  window.gameState가 아닌 전역 gameState를 참조해야 함)
        const originalUpdateUI = window.updateUI;
        window.updateUI = function() {
            if (typeof originalUpdateUI === 'function') originalUpdateUI();
            if (typeof gameState !== 'undefined' && gameState.currentScreen === 'game') {
                showGameUI();
            } else {
                hideGameUI();
            }
        };
    </script>
</body>
</html>
